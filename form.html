<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>基本资料表单</title>
    <meta name="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
</head>
<body>
<form>
    <label for="name">姓名&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
    <input class="input" type="text" id="name" name="name" placeholder="谭云聪"><br><br>
    <label for="id">id&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
    <input class="input" type="text" id="id" name="id" placeholder="301692714"><br><br>
    <span>性别&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
    <input type="radio" id="male" name="sex" value="男">
    <label for="male">男&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
    <input type="radio" id="female" name="sex" value="女">
    <label for="female">女</label><br><br>
    <span>手机号&nbsp;&nbsp;&nbsp;</span>
    <input class="input" type="text" id="phone" name="phone" placeholder="177****0053">
    <label id="revise" for="phone">&nbsp;&nbsp;&nbsp;&nbsp;修改</label><br><br>
    <label for="address">单位&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
    <input class="input" type="text" id="address" name="address" placeholder="+ 添加单位"><hr>
    <div>
        重庆理工大学<br>
        <span class="add">学号/工号:12323020301</span>
    </div><hr>
    <div>
        重庆理工大学图书馆<br>
        <span class="add">学号/工号:12323020301</span>
    </div><hr>
</form>
</body>
</html>
