<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../style/changepassword.css">
</head>
<body>
     <label for="usedPassword">旧密码:</label>
     <input type="password" id="usedPassword" name="usedPassword" placeholder="请输入" required>
     <button onclick="showUsed()"><img id="show1" src="/images/hiddenpassword.png" alt="隐藏图片图标" width="20px" height="20px"></button>
     <button id="forget" onclick="jump('forget.html')">忘记密码</button><br>
     <label for="newPassword">新密码:</label>
     <input type="password" id="newPassword" name="newPassword" placeholder="请输入" required>
     <button onclick="showNew()"><img id="show2" src="/images/hiddenpassword.png" alt="隐藏图片图标" width="20px" height="20px"></button><br>
     <label for="assured">确认新密码:</label>
     <input type="password" id="assured" name="assured" placeholder="请输入" required>
     <button onclick="showAssure()"><img id="show3" src="/images/hiddenpassword.png" alt="隐藏图片图标" width="20px" height="20px"></button><br>
     <button id="confirm" onclick="check()">确定</button>
     <script>
         const usedPassword=document.getElementById("usedPassword").value;
         const newPassword=document.getElementById("newPassword").value;
         const assure=document.getElementById("assured").value;
         function check(){
             if (usedPassword===""||newPassword===""||assure==="") {
                 alert("有密码框为空，请输入");
                 return;
             }
             if (usedPassword===newPassword) {
             alert("新旧密码不能一致，请重新输入");
         }
         if (newPassword===assure){
             alert("确认密码与新密码不能一致，请重新输入");
         }
         if (usedPassword===assure){
             alert("旧密码与新密码不能一致，请重新输入");
         }
         }
         function showUsed(){
             let id1=document.getElementById("usedPassword");
             let id2=document.getElementById("show1");
             if (id1.type==='password') {
                 id1.type='text';
                 id2.src="/images/showpassword.png";
             }
             else {
                 id1.type = 'password';
                 id2.src="/images/hiddenpassword.png";
             }
         }
         function showNew(){
             let id1=document.getElementById("newPassword");
             let id2=document.getElementById("show2");
             if (id1.type==='password') {
                 id1.type='text';
                 id2.src="/images/showpassword.png";
             }
             else {
                 id1.type = 'password';
                 id2.src="/images/hiddenpassword.png";
             }
         }
         function showAssure(){
             let id1=document.getElementById("assured");
             let id2=document.getElementById("show3");
             if (id1.type==='password') {
                 id1.type='text';
                 id2.src="/images/showpassword.png";
             }
             else {
                 id1.type = 'password';
                 id2.src="/images/hiddenpassword.png";
             }
         }
         function jump(pageUrl){
             parent.document.getElementById("form").src=pageUrl;
         }
     </script>
</body>
</html>
