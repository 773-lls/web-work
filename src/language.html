<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>语言界面</title>
</head>
<body>
<input type="radio" name="语言" id="cn" onclick="jump('form.html');">
<label for="cn">中文</label>
<input type="radio" name="语言" id="en" onclick="jump('form.html');">
<label for="en">英文</label>
<script>
    function jump(pageUrl){
        parent.document.getElementById("form").src=pageUrl;
    }

</script>
</body>
</html>
