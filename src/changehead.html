<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改头像</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="../style/changehead.css">
</head>
<body>
<div>
    <label for="imageInput">请选择图片进行本地上传:</label><br>
     <input type="file" id="imageInput">
    <button id="myHead">上传头像</button>
    <div>
        <img id="image">
    </div>
    <button id="saveHead" type="button">保存头像</button>
    <script>
        const imageInput=document.getElementById("imageInput");
        const myHead=document.getElementById("myHead");
        const image=document.getElementById("image");
        const saveHead=document.getElementById("saveHead");
        let tempImage="";
        function getHeadIn(iframeId,imgId){
            const iframe=window.top.document.getElementById(iframeId);
            if (!iframe) return null;
            return iframe.contentDocument.getElementById(imgId);
        }
        myHead.onclick =function(){
            imageInput.click();
        }
        imageInput.onchange=function(){
            const file=this.files[0];
            if (!file) return;
            const reader=new FileReader()
            reader.readAsDataURL(file);
            reader.onload=function(e){
                image.src=e.target.result;
                image.style.display="inline-block";
                tempImage=e.target.result;
                alert("图片已选择，现在的是预览图片，点击保存头像应用到三个头像");
            }
        }
            saveHead.onclick =function() {
            if (tempImage===""){
                alert("请先选择图片!");
                return;
            }
            const rightHead=getHeadIn("top","rightHead");
            const leftHead=getHeadIn("left","leftHead");
            if (rightHead) rightHead.src = tempImage;
            if (leftHead) leftHead.src= tempImage;
            alert("头像已同步到顶部和左侧");
            }
    </script>
</div>
</body>
</html>
